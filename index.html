<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts for Professional Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;600&family=Bebas+Neue&family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">
    
    <title>Geosystems | Advanced Geospatial Solutions</title>
  </head>
  <body style="background:#0f172a;">
    <div id="root">
      <style>
        body { margin: 0; background-color: #f8fafc; }
        .app-shell {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #cbd5e1;
          border-top: 3px solid #2563eb;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      
      <div class="app-shell">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
